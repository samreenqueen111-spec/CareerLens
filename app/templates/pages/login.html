{% extends "base.html" %}

{% block content %}
<div class="container section-sm" style="max-width: 480px; margin: 2rem auto;">
  <div class="card" style="padding: 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="CareerLens AI" width="36" height="36" style="margin-bottom: 0.75rem;">
      <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">Welcome Back</h2>
      <p style="font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: 0;">
        Log in to view your saved resume analyses and downloaded reports.
      </p>
    </div>

    {% if error %}
    <div class="alert alert-danger" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: var(--radius-md); background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger-500); color: var(--danger-600); font-size: var(--text-sm);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login_view', next=request.args.get('next')) }}">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="email" style="display: block; font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.5rem;">Email Address</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus
               placeholder="name@example.com"
               class="form-control" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-primary); color: var(--text-main); font-size: var(--text-sm);">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="password" style="display: block; font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.5rem;">Password</label>
        <input type="password" id="password" name="password" required
               placeholder="••••••••"
               class="form-control" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-primary); color: var(--text-main); font-size: var(--text-sm);">
      </div>

      <button type="submit" class="btn btn-primary w-full" style="width: 100%; padding: 0.75rem; font-weight: 600;">
        Log In
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: var(--text-sm); color: var(--text-secondary);">
      Don't have an account? <a href="{{ url_for('auth.signup_view', next=request.args.get('next')) }}" style="color: var(--primary-600); font-weight: 600;">Sign Up</a>
    </div>
  </div>

  <div style="text-align: center; margin-top: 1.5rem; font-size: var(--text-xs); color: var(--text-muted);">
    <a href="{{ url_for('analyzer.analyzer_view') }}" style="color: var(--text-muted);">← Back to analyzer</a>
  </div>
</div>
{% endblock %}
